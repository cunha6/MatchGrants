<table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
  <tbody style="width:100%">
    <tr style="width:100%">
      <td style="border-bottom:2px solid #0312c2;padding-bottom:8px;vertical-align:bottom;width:60%">
        <p style="font-family:'Gellix',Arial,sans-serif;font-size:11px;line-height:24px;margin:0;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:#0312c2">Aviso</p>
      </td>
      <td style="border-bottom:2px solid #0312c2;padding-bottom:8px;vertical-align:bottom;width:20%">
        <p style="font-family:'Gellix',Arial,sans-serif;font-size:11px;line-height:24px;margin:0;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:#0312c2">Dotação</p>
      </td>
      <td style="border-bottom:2px solid #0312c2;padding-bottom:8px;vertical-align:bottom;width:20%">
        <p style="font-family:'Gellix',Arial,sans-serif;font-size:11px;line-height:24px;margin:0;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:#0312c2">Taxa financ.</p>
      </td>
    </tr>
  </tbody>
</table>
{% for aviso in avisos %}
<table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
  <tbody style="width:100%">
    <tr style="width:100%">
      <td style="border-bottom:1px solid #ebf5fc;padding-top:14px;padding-bottom:14px;vertical-align:top;width:60%">
        <a href="{{ aviso.url }}" style="font-family:'Gellix',Arial,sans-serif;color:#0312c2;text-decoration-line:none;font-size:14px;line-height:1.4;font-weight:600;text-decoration:underline" target="_blank">{{ aviso.titulo }}</a>
      </td>
      <td style="border-bottom:1px solid #ebf5fc;padding-top:14px;padding-bottom:14px;vertical-align:top;width:20%">
        <p style="font-family:'Gellix',Arial,sans-serif;font-size:14px;line-height:1.4;margin:0;color:#333333">{{ aviso.dotacao }}</p>
      </td>
      <td style="border-bottom:1px solid #ebf5fc;padding-top:14px;padding-bottom:14px;vertical-align:top;width:20%">
        <p style="font-family:'Gellix',Arial,sans-serif;font-size:14px;line-height:1.4;margin:0;color:#333333">{{ aviso.taxa }}</p>
      </td>
    </tr>
  </tbody>
</table>
{% endfor %}
