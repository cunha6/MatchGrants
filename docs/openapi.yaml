openapi: 3.0.3
info:
  title: MatchGrants API
  description: >
    Plataforma de scraping/extração de avisos de financiamento (Portugal2030, Compete2030, PRR),
    anúncios de contratação pública (base.gov.pt) e matching de empresas por NIF.

    As rotas de `avisos` e `contratações públicas` seguem a mesma forma (mesmo conjunto de ações sobre um
    único recurso): listar, detalhe, editar, servir documento(s), disparar ingestão.
  version: "1.0.0"
servers:
  - url: /
    description: Relativo ao host onde a app está a correr (dev/produção).
tags:
  - name: avisos
    description: Avisos de financiamento (Grant) — scrape, extração IA, listagem, edição.
  - name: contratações públicas
    description: Anúncios de contratação pública (Notice) — importação, listagem, edição.
  - name: match
    description: Motor de matching por NIF.
  - name: users
    description: Autenticação e gestão de utilizadores/perfis.
  - name: planned-grants
    description: Plano Anual de Avisos (Portugal 2030) — previsões, não avisos publicados.
  - name: newsletter
    description: Agregação semanal de novidades (avisos + anúncios + previstos).

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: >
        Sessão Django (cookie `sessionid`), obtida em POST /users/login/. Algumas rotas são
        públicas (sem sessão); as que exigem papel específico estão marcadas em cada operação.

  parameters:
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    page_size:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: Máximo 200.

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    ValidationError:
      type: object
      properties:
        error: { type: string }
        details:
          type: object
          description: "{campo: [mensagens de erro]}"
          additionalProperties:
            type: array
            items: { type: string }

    PaginationEnvelope:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        num_pages: { type: integer }
      required: [total, page, page_size, num_pages]

    # --- avisos ---------------------------------------------------------
    GrantSummary:
      type: object
      description: Forma ENXUTA usada na listagem (GET /avisos/list/).
      properties:
        id: { type: integer }
        grant_code: { type: string, nullable: true }
        title: { type: string, nullable: true }
        closing_date: { type: string, nullable: true, description: "Texto livre (não necessariamente ISO)." }
        total_allocation: { type: number, nullable: true }
        financing_rate: { type: number, nullable: true, description: "Override manual ou calculado das linhas-filhas." }
        next_phase_date: { type: string, format: date, nullable: true }
        active: { type: boolean }

    GrantDetail:
      type: object
      description: >
        Detalhe COMPLETO de um aviso (GET /avisos/{id}/) — todos os ~80 campos extraídos pela
        pipeline P1–P7 (título, datas, CAE incluído/excluído, elegibilidade, financeiro,
        indicadores, documentos…) mais as relações (phases, covered_areas, phase_areas,
        financing_rates, expense_limits, non_compliance_penalties, evaluation_methodologies,
        beneficiaries_by_action, documents). Só os campos mais consultados estão tipados aqui;
        os restantes seguem o mesmo padrão simples (string/number/list) — ver o modelo `Grant`
        em avisos/models.py para a lista exaustiva.
      allOf:
        - $ref: "#/components/schemas/GrantSummary"
      properties:
        objective: { type: string, nullable: true }
        financing_program: { type: string, nullable: true }
        managing_entity: { type: string, nullable: true }
        publication_date: { type: string, nullable: true }
        opening_date: { type: string, nullable: true }
        included_caes:
          type: array
          items: { type: string }
          description: "Padrões wildcard de 5 chars, ex: '651**'."
        excluded_caes:
          type: array
          items: { type: string }
        eligible_regions:
          type: array
          items: { type: string }
        maximum_self_financing: { type: number, nullable: true }
        minimum_investment: { type: number, nullable: true }
        maximum_investment: { type: number, nullable: true }
        financing_rate_manual: { type: boolean, description: "True se financing_rate foi fixado à mão." }
        document_url: { type: string, nullable: true, description: "Link para GET /avisos/{id}/document/, se o PDF existir." }
        phases:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string, nullable: true }
              start_date: { type: string, nullable: true }
              end_date: { type: string, nullable: true }
              access_condition: { type: string }
        covered_areas:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              geographic_area: { type: string, nullable: true }
        phase_areas:
          type: array
          items:
            type: object
            properties:
              phase_id: { type: integer, nullable: true }
              area_id: { type: integer, nullable: true }
              fund_name: { type: string, nullable: true }
              budget_allocation: { type: number, nullable: true }
              max_financing_rate: { type: number, nullable: true }
              distribution: { type: array, items: { type: object } }
        financing_rates:
          type: array
          items:
            type: object
            properties:
              company_size: { type: string, nullable: true }
              aid_regime: { type: string, nullable: true }
              base_rate: { type: string, nullable: true }
              regional_bonus: { type: string, nullable: true }
              max_global_rate: { type: string, nullable: true }
        documents:
          type: array
          items:
            type: object
            properties:
              doc_type: { type: string }
              name: { type: string, nullable: true }
              url: { type: string, nullable: true }
              is_canonical: { type: boolean }
        last_update_source: { type: string, enum: [scrape, manual] }
        last_updated_by: { type: string, nullable: true, description: "Username de quem editou, ou null se veio do scrape/IA." }
      additionalProperties: true

    GrantEditRequest:
      type: object
      description: >
        {campo: valor, ...} — qualquer campo próprio do aviso (exceto id, annex_documents,
        applicable_legislation, last_update_source, last_updated_by). Duas chaves especiais
        substituem a coleção inteira: `financing_rates` e `phase_areas`.
      additionalProperties: true

    GrantEditResponse:
      type: object
      properties:
        id: { type: integer }
        grant_code: { type: string, nullable: true }
        updated: { type: array, items: { type: string } }
        ignored: { type: array, items: { type: string } }
        collections_updated: { type: array, items: { type: string } }
        financing_rate: { type: number, nullable: true }

    ScrapeSummary:
      type: object
      description: Resumo do scrape disparado (varia por fonte).
      additionalProperties: true

    # --- contratações públicas ---------------------------------------------------------
    NoticeSummary:
      type: object
      description: Forma ENXUTA usada na listagem (GET /anuncios/list/).
      properties:
        id: { type: integer }
        notice_number: { type: string }
        description: { type: string }
        entity_name: { type: string }
        act_type: { type: string }
        contract_types: { type: array, items: { type: string } }
        base_price: { type: number, nullable: true }
        proposal_deadline: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, inactive, to_fix] }

    NoticeDetail:
      type: object
      description: Detalhe COMPLETO de um anúncio (GET /anuncios/{id}/).
      allOf:
        - $ref: "#/components/schemas/NoticeSummary"
      properties:
        incm_id: { type: string }
        publication_date: { type: string, format: date, nullable: true }
        entity_nif: { type: string }
        url: { type: string }
        dr_number: { type: string }
        series: { type: string }
        cpvs: { type: array, items: { type: string } }
        lots: { type: array, items: { type: string } }
        procedure_type: { type: string }
        year: { type: integer, nullable: true }
        environmental_criteria: { type: boolean }
        proposal_period_days: { type: integer, nullable: true }
        procedure_documents_url: { type: string }
        specifications_path: { type: string, description: "Caminho local do caderno de encargos (pdf_Anuncios/)." }
        specifications_url: { type: string, nullable: true, description: "GET /anuncios/{id}/document/cadernoEncargos/, se o ficheiro existir." }
        program_path: { type: string, description: "Caminho local do programa de concurso (pdf_Anuncios/programa_Concurso/)." }
        program_url: { type: string, nullable: true, description: "GET /anuncios/{id}/document/programaConcurso/, se o ficheiro existir." }
        last_update_source: { type: string, enum: [scrape, manual] }
        last_updated_by: { type: string, nullable: true }
        ai_detail: { $ref: "#/components/schemas/NoticeAiDetailState" }

    NoticeAiDetailState:
      type: object
      description: "Estado + último detalhe IA cacheado do caderno de encargos (dentro de NoticeDetail — mesmos dados de POST /anuncios/{id}/detail/, sem precisar de chamar essa rota). status=pending se a geração ainda nunca foi pedida — os restantes campos vêm vazios nesse caso."
      properties:
        status:
          type: string
          enum: [pending, generating, done, error]
        descricao_detalhada: { type: string }
        avaliacao:
          type: string
          description: "Frase única com o tipo de critério de adjudicação e os fatores/pesos (ex: \"Multifator – Preço (30%) + Qualidade Técnica (70%)\", ou \"Monofator – Preço mais baixo (100%)\")."
        observacoes:
          type: array
          items: { type: string }

    NoticeAiDetail:
      type: object
      description: "Detalhe gerado por IA a partir do caderno de encargos (POST /anuncios/{id}/detail/). Prompt fixo, extração factual — não é uma opinião da IA sobre o concurso. Devolvido quando já está pronto (status=done); enquanto está a gerar, o endpoint devolve 202 (ver NoticeAiDetailGenerating)."
      properties:
        status:
          type: string
          enum: [done]
        descricao_detalhada:
          type: string
          description: Descrição detalhada do objeto do procedimento, extraída do caderno de encargos.
        avaliacao:
          type: string
          description: "Frase única com o tipo de critério de adjudicação (Monofator/Multifator/Outro) e os fatores/subfatores + pesos, tal como escritos no documento (ex: \"Multifator – Proposta economicamente mais vantajosa: Preço (30%) + Experiência Técnica da Equipa (35%) + Qualidade Técnica da Proposta (35%)\"). \"Monofator – Preço mais baixo (100%)\" se o critério for só o preço; \"Não foi possível identificar os critérios de avaliação no documento.\" se a secção não existir."
        observacoes:
          type: array
          items: { type: string }
          description: Lista de notas relevantes, uma por item (alvará, visita ao local, caução, prazo de execução, etc.).

    NoticeAiDetailGenerating:
      type: object
      description: "Devolvido com 202 enquanto o detalhe IA está a ser gerado em background — repetir o pedido mais tarde (ex: ao reabrir o anúncio) devolve 200 com NoticeAiDetail quando estiver pronto."
      properties:
        status:
          type: string
          enum: [generating]

    NoticeEditRequest:
      type: object
      description: "{campo: valor, ...} — qualquer campo próprio do anúncio, exceto id, last_update_source, last_updated_by."
      additionalProperties: true

    NoticeEditResponse:
      type: object
      properties:
        id: { type: integer }
        notice_number: { type: string }
        updated: { type: array, items: { type: string } }
        ignored: { type: array, items: { type: string } }

    NoticeFilters:
      type: object
      properties:
        act_types: { type: array, items: { type: string } }
        contract_types: { type: array, items: { type: string } }
        statuses:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              label: { type: string }

    ImportSummary:
      type: object
      properties:
        num_days: { type: integer }
        total_received: { type: integer }
        with_keywords: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        deactivated_expired: { type: integer }
        specifications: { type: string }

    # --- match --------------------------------------------------------
    MatchRequest:
      type: object
      required: [nif]
      properties:
        nif: { type: string }
        cae: { description: "Lista ou string separada por vírgulas — override quando o nif.pt não traz CAE." }
        region: { type: string }
        dimension: { type: string, enum: [micro, pequena, media, grande] }
        entity_type: { type: string }
        email: { type: string, description: "Contacto — exigido sem sessão para revelar os matches." }
        name: { type: string, description: "Contacto — exigido sem sessão para revelar os matches." }
        job_title: { type: string, description: "Função na empresa — exigido sem sessão para revelar os matches." }

    MatchResult:
      type: object
      properties:
        company:
          type: object
          description: Dados ricos do contribuinte (nif.pt + enriquecimento), incluindo 'activity'.
          additionalProperties: true
        nif: { type: string }
        viewer_user_id: { type: integer, nullable: true, description: "null se o pedido veio autenticado." }
        matches:
          type: array
          items:
            type: object
            properties:
              opportunity_id: { type: integer }
              grant_code: { type: string }
              title: { type: string }
              score: { type: integer }
              max_score: { type: integer }
              activity_relevance: { type: number, nullable: true }
              sector_similarity: { type: number, nullable: true }
              general_similarity: { type: number, nullable: true }
              effective_financing_rate: { type: number, nullable: true }
              effective_budget_allocation: { type: number, nullable: true }
              eligibility:
                type: array
                items:
                  type: object
                  properties:
                    criterion: { type: string }
                    label: { type: string }
                    eligible: { type: boolean }
              breakdown:
                type: array
                items:
                  type: object
                  properties:
                    criterion: { type: string }
                    label: { type: string }
                    matched: { type: boolean }
                    points: { type: integer }
              llm_adequate: { type: boolean, nullable: true, description: "null = não avaliado (fora do top-10 ou LLM indisponível)." }
              llm_reason:
                type: string
                nullable: true
                description: >
                  Se llm_adequate=false: porque não serve. Se llm_adequate=true: que tipo de
                  investimento/projeto a empresa pode desenvolver no âmbito deste aviso (não é
                  só uma confirmação genérica).

    MissingFieldsError:
      type: object
      properties:
        error: { type: string }
        needs_more_info: { type: boolean }
        missing_fields:
          type: array
          description: >-
            Além de campos em branco, `field: "email"` também aparece quando o email foi
            preenchido mas não serve para captar um lead de empresa — o `label` varia consoante
            o motivo: "Email inválido" para formato incorreto ou domínio webmail
            genérico/gratuito (gmail, outlook, hotmail...)/temporário-descartável conhecido; uma
            mensagem dedicada ("O domínio deste email não existe — introduza um email
            profissional da empresa.") quando o domínio, apesar de bem formatado, não tem
            registos DNS (MX/A) — não existe de facto.
          items:
            type: object
            properties:
              field: { type: string }
              label: { type: string }

    PromoteResponse:
      type: object
      properties:
        user_id: { type: integer }
        nif: { type: string }
        role: { type: string }
        is_active: { type: boolean }
        has_login: { type: boolean }

    # --- users --------------------------------------------------------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    UserDetail:
      type: object
      description: >
        Perfil do utilizador (auth.User + users.UserProfile fundidos). Os campos variam com o
        PAPEL: um `admin`/`commercial_grants`/`commercial_public` é uma pessoa da equipa e traz
        SÓ os campos de identidade (id, username, first_name, email, role, is_active, is_staff,
        is_superuser, date_joined). Os campos de ENTIDADE abaixo (NIF, CAE, morada, NUTS,
        job_title) descrevem uma EMPRESA candidata e só saem para `client` e `viewer` — nas
        contas internas não vêm sequer com valor nulo, estão ausentes da resposta.
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        first_name: { type: string, description: "Nome da pessoa. Definível na criação e na atualização." }
        role: { type: string, enum: [admin, commercial_grants, commercial_public, client, viewer] }
        is_active: { type: boolean }
        job_title: { type: string, nullable: true, description: "Só client/viewer. Função na empresa — preenchida pelo pop-up de contacto do match sem login." }
        nif: { type: string, nullable: true }
        entity_type: { type: string, nullable: true }
        entity_size: { type: string, nullable: true }
        main_cae: { type: string, nullable: true }
        secondary_cae: { type: array, items: { type: string } }
        postal_code: { type: string, nullable: true, description: "Código postal introduzido no registo — fonte de city/county/region (ver POST /users/create/)." }
        region: { type: string, nullable: true, description: "Derivado automaticamente do postal_code (CTT + NUTS), não pedido diretamente." }
        city: { type: string, nullable: true, description: "Derivado automaticamente do postal_code." }
        county: { type: string, nullable: true, description: "Derivado automaticamente do postal_code." }
        matched_grants:
          type: array
          description: >
            Só client. Resultado do ÚLTIMO POST /match/evaluate-nif/ feito por este client
            sobre o PRÓPRIO NIF (substituído a cada novo match, não é um histórico
            acumulado). Cada item tem o suficiente para o front-end linkar para
            GET /avisos/<id>/.
          items:
            type: object
            properties:
              id: { type: integer }
              grant_code: { type: string, nullable: true }
              title: { type: string, nullable: true }
      additionalProperties: true

    UserListEnvelope:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          properties:
            users:
              type: array
              items: { $ref: "#/components/schemas/UserDetail" }

    # --- planned-grants / newsletter -----------------------------------
    PlannedGrant:
      type: object
      properties:
        id: { type: integer }
        plan_id: { type: integer }
        designation: { type: string }
        programme: { type: string }
        expected_start: { type: string, format: date, nullable: true }
        expected_end: { type: string, format: date, nullable: true }
        fund: { type: string }
        budget: { type: number, nullable: true }
        nuts: { type: string }

    PlannedGrantListEnvelope:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          properties:
            planned_grants:
              type: array
              items: { $ref: "#/components/schemas/PlannedGrant" }

    WeeklyNewsletter:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        new_grants: { type: array, items: { $ref: "#/components/schemas/GrantDetail" } }
        updated_grants: { type: array, items: { $ref: "#/components/schemas/GrantDetail" } }
        new_notices: { type: array, items: { $ref: "#/components/schemas/NoticeDetail" } }
        updated_notices: { type: array, items: { $ref: "#/components/schemas/NoticeDetail" } }
        coming_next_30_days: { type: array, items: { $ref: "#/components/schemas/PlannedGrant" } }

paths:
  # ============================= AVISOS =============================
  /avisos/list/:
    get:
      tags: [avisos]
      summary: Listagem paginada de avisos
      description: >
        Pesquisa, filtros e ordenação aplicados a TODO o conjunto antes de paginar (não só à
        página devolvida). CAE/região/dimensão reutilizam as mesmas regras de elegibilidade do
        motor de match — um aviso sem restrição no critério casa com qualquer valor pesquisado.
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Pesquisa em código do aviso + título.
        - name: cae
          in: query
          schema: { type: string }
          description: "CAE elegível, regra do prefixo mais específico (ex: aviso com '55***' casa com '55849')."
        - name: region
          in: query
          schema: { type: string }
          description: Região elegível OU área abrangida (contains bidirecional).
        - name: dimension
          in: query
          schema: { type: array, items: { type: string, enum: [micro, pequena, media, grande] } }
          style: form
          explode: true
          description: "Repetível (?dimension=micro&dimension=media) ou CSV (?dimension=micro,media)."
        - name: active
          in: query
          schema: { type: string, enum: [true, false, all], default: "true" }
        - name: publication_from
          in: query
          schema: { type: string, format: date }
        - name: publication_to
          in: query
          schema: { type: string, format: date }
        - name: closing_from
          in: query
          schema: { type: string, format: date }
        - name: closing_to
          in: query
          schema: { type: string, format: date }
        - name: allocation_min
          in: query
          schema: { type: number }
        - name: allocation_max
          in: query
          schema: { type: number }
        - name: rate_min
          in: query
          schema: { type: number }
        - name: rate_max
          in: query
          schema: { type: number }
        - name: order_by
          in: query
          schema:
            type: string
            enum: [publication_recent, publication_oldest, closing_earliest, closing_latest,
                   allocation_highest, allocation_lowest, rate_highest, rate_lowest]
            default: publication_recent
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      grants:
                        type: array
                        items: { $ref: "#/components/schemas/GrantSummary" }

  /avisos/{id}/:
    get:
      tags: [avisos]
      summary: Detalhe completo de um aviso
      description: >-
        Com sessão, qualquer aviso. Sem sessão, só os avisos devolvidos por um match feito NA
        MESMA sessão (cookie) — trocar o id na URL para um aviso fora desse conjunto dá 404,
        indistinguível de um id inexistente.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantDetail" }
        "404":
          description: Aviso não acessível nesta sessão ou inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /avisos/{id}/edit/:
    put:
      tags: [avisos]
      summary: Edita um aviso
      security: [{ sessionAuth: [] }]
      description: "Papel exigido: admin, commercial_grants ou commercial_public. Atómico — tudo grava ou nada grava."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantEditRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantEditResponse" }
        "400":
          description: Valores inválidos ou corpo malformado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "401":
          description: Sem sessão
        "403":
          description: Sem permissão (papel fora de admin/commercial_grants/commercial_public)
        "404":
          description: Aviso não encontrado

  /avisos/{id}/document/:
    get:
      tags: [avisos]
      summary: Abre o pdf do aviso
      description: >-
        Mesma política de acesso do detalhe: com sessão, qualquer aviso; sem sessão, só os
        avisos devolvidos por um match feito NA MESMA sessão (cookie). Um aviso fora desse
        conjunto dá 404, igual a um id inexistente — o PDF não é enumerável por id.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: Aviso não acessível nesta sessão, inexistente, ou documento indisponível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /avisos/:
    post:
      tags: [avisos]
      summary: Dispara o scrape de todas as fontes (Compete2030 + Portugal2030 + PRR)
      description: Automação diária
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScrapeSummary" }

  /avisos/compete/:
    post:
      tags: [avisos]
      summary: Dispara o scrape só do Compete2030
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScrapeSummary" }

  /avisos/portugal/:
    post:
      tags: [avisos]
      summary: Dispara o scrape só do Portugal2030
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScrapeSummary" }

  /avisos/prr/:
    post:
      tags: [avisos]
      summary: Dispara o scrape só do PRR
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScrapeSummary" }

  # ============================= ANUNCIOS =============================
  /anuncios/list/:
    get:
      tags: [contratações públicas]
      summary: Listagem paginada de anúncios
      description: >
        Por omissão mostra ativos + por corrigir (esconde inativos); `status` sobrepõe isto e
        devolve exatamente esse estado. `q` pesquisa em TODO o conjunto antes de paginar.
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Pesquisa em descrição/entidade/número — só entre anúncios ATIVOS.
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive, to_fix] }
        - name: act_type
          in: query
          schema: { type: string }
        - name: procedure_type
          in: query
          schema: { type: string }
        - name: contract_type
          in: query
          schema: { type: string }
        - name: order_by
          in: query
          schema:
            type: string
            enum: [publication_recent, publication_oldest, deadline_latest, deadline_earliest,
                   price_highest, price_lowest]
            default: publication_recent
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      notices:
                        type: array
                        items: { $ref: "#/components/schemas/NoticeSummary" }

  /anuncios/filters/:
    get:
      tags: [contratações públicas]
      summary: Filtro do tipo de ação, tipos de contrato, datas, dotações
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeFilters" }

  /anuncios/{id}/:
    get:
      tags: [contratações públicas]
      summary: Detalhe completo de um anúncio
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeDetail" }
        "404":
          description: Anúncio não encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /anuncios/{id}/edit/:
    put:
      tags: [contratações públicas]
      summary: Edita um anúncio
      security: [{ sessionAuth: [] }]
      description: "Papel exigido: admin ou commercial_public (commercial_grants não tem acesso a anúncios)."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoticeEditRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeEditResponse" }
        "400":
          description: Valores inválidos, notice_number duplicado, ou corpo malformado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "401":
          description: Sem sessão
        "403":
          description: Sem permissão
        "404":
          description: Anúncio não encontrado

  /anuncios/{id}/detail/:
    post:
      tags: [contratações públicas]
      summary: Detalhe IA do caderno de encargos
      security: [{ sessionAuth: [] }]
      description: >
        NÃO bloqueia à espera do OpenAI. Se já houver um detalhe cacheado (status=done),
        devolve-o logo com 200. Caso contrário arranca a conversão do caderno de encargos
        para markdown + o pedido ao OpenAI numa thread de FUNDO e devolve 202 já — repetir
        o pedido mais tarde (ex: ao reabrir o anúncio) devolve 200 quando estiver pronto.
        Cacheado em Notice.specifications_description/evaluation/observations — uma vez
        gerado, chamadas seguintes não repetem o custo. `?refresh=true` força uma nova
        geração (também em background). Papel exigido: admin ou commercial_public (ao
        contrário do detalhe simples de /anuncios/{id}/, client não tem acesso — este
        endpoint tem custo).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: refresh
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Força nova geração mesmo que já exista um detalhe cacheado.
      responses:
        "200":
          description: Detalhe já pronto (cacheado ou gerado agora, se force=true tiver terminado).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeAiDetail" }
        "202":
          description: Ainda não há detalhe pronto — arrancou (ou já estava a decorrer) a geração em background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeAiDetailGenerating" }
        "401":
          description: Sem sessão
        "403":
          description: Sem permissão
        "404":
          description: Anúncio não encontrado, ou sem caderno de encargos disponível/convertível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405":
          description: Método não permitido (só POST)
        "502":
          description: Erro a gerar o detalhe IA (ex. falha na chamada ao OpenAI)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /anuncios/{id}/document/cadernoEncargos/:
    get:
      tags: [contratações públicas]
      summary: Abre o caderno de encargos
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: Anúncio ou documento não disponível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /anuncios/{id}/document/programaConcurso/:
    get:
      tags: [contratações públicas]
      summary: Abre o programa de concurso
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: Anúncio ou documento não disponível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /anuncios/:
    post:
      tags: [contratações públicas]
      summary: Automatiza a importação do base.gov.pt dos últimos 15 dias
      description: >
        Aberto (sem autenticação). Regista os anúncios rapidamente (sem descarregar
        documentos) e relança a extração de documentos num processo separado.
      parameters:
        - name: num_days
          in: query
          schema: { type: integer, default: 15 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSummary" }
        "400":
          description: "'num_days' não é um inteiro"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Falha de configuração/comunicação com a API base.gov.pt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ============================= MATCH =============================
  /match/evaluate-nif/:
    post:
      tags: [match]
      summary: Cruza um nif com os avisos ativos elegíveis, ordenados por relevância
      description: >
        Sem autenticação, regista o nif como viewer (lead) e exige contacto (email/name/
        job_title) antes de devolver `matches`: a procura corre sempre já nesta chamada, mas
        sem os 3 campos de contacto a resposta é 422 (mesmo mecanismo do CAE/localização em
        falta) — reenviar o mesmo NIF com email/name/job_title preenchidos devolve os
        resultados (calculados só uma vez, servidos de cache). Autenticado, só consulta —
        `viewer_user_id` vem null, contacto é ignorado e nunca há retenção. Se quem chama é um
        `client` autenticado e o NIF pedido é o do PRÓPRIO perfil, os `matches` desta chamada
        substituem `UserProfile.matched_grants` (ver `UserDetail.matched_grants`) — não
        acumula histórico, fica só o último resultado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchResult" }
        "400":
          description: NIF em falta, inválido, inexistente ou contribuinte inativo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Faltam dados obrigatórios — CAE/localização (reenviar com overrides) OU, sem
            sessão, contacto (email/name/job_title) para revelar os resultados já calculados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissingFieldsError" }
        "502":
          description: Falha de configuração/comunicação com a API nif.pt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /match/promote/{nif}/:
    post:
      tags: [match]
      summary: Promove um viewer a client
      security: [{ sessionAuth: [] }]
      description: >
        Papel exigido: admin, commercial_grants ou commercial_public. Ao ativar, envia à conta
        o email com o link para definir a password (só na ativação — promover de novo uma conta
        já ativa não reenvia). Ao ATIVAR a conta,
        qualquer password definida enquanto ela ainda era viewer é invalidada (um viewer nasce
        de um pedido anónimo, logo essa password não é de confiança) — por isso `has_login`
        vem a false e as credenciais são definidas depois, já com a conta ativa.
      parameters:
        - name: nif
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoteResponse" }
        "401":
          description: Sem sessão
        "403":
          description: Sem permissão
        "404":
          description: Não existe nenhum viewer/registo com esse NIF
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ============================= USERS =============================
  /users/login/:
    post:
      tags: [users]
      summary: Inicio de sessão
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "401":
          description: Credenciais inválidas
        "429":
          description: Demasiadas tentativas falhadas (throttle de 5 min)

  /users/logout/:
    post:
      tags: [users]
      summary: Termina a sessão atual
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: OK

  /users/password-reset/:
    post:
      tags: [users]
      summary: Pede o email de redefinição/definição de password
      description: >
        Público. Resposta SEMPRE 200 com a mesma mensagem, exista ou não uma conta com esse
        email — nunca revela se a conta existe. Funciona mesmo para contas que nunca tiveram
        password, servindo também para definir a primeira. Só chega a contas ATIVAS: o email
        de um viewer é escrito por um pedido anónimo (o match), por isso deixá-lo passar aqui
        permitiria a quem soubesse o NIF público deixar uma password à espera da promoção.
        Throttle de 3 pedidos / 15 min por email (silencioso — mesma resposta).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "200":
          description: OK (sempre, independentemente do resultado real)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /users/password-reset/confirm/:
    post:
      tags: [users]
      summary: Confirma a redefinição de password (uid + token do link recebido por email)
      description: >
        Público. O token (django.contrib.auth.tokens) está ligado ao hash da password atual
        do utilizador — invalida-se sozinho assim que a password muda, e expira ao fim de
        PASSWORD_RESET_TIMEOUT (Django, 3 dias por omissão).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uid, token, password]
              properties:
                uid: { type: string, description: "uidb64 vindo do link do email." }
                token: { type: string }
                password: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          description: Link inválido/expirado OU password que não cumpre a política (mesma forma de erro para os dois — não distingue, para não dar pistas)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/:
    get:
      tags: [users]
      summary: Lista utilizadores paginado e filtrável
      security: [{ sessionAuth: [] }]
      description: >
        Papel exigido: admin, commercial_grants ou commercial_public. Comercial só vê viewer/
        client (nunca superuser, sem filtro de estado); admin filtra por role/active e todos os
        campos, e é o único que vê superusers e outros admins/comerciais.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
        - name: role
          in: query
          schema: { type: string }
          description: Só admin.
        - name: active
          in: query
          schema: { type: string, enum: [true, false, all] }
          description: Só admin.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListEnvelope" }
        "401":
          description: Sem sessão
        "403":
          description: Sem permissão

  /users/me/:
    get:
      tags: [users]
      summary: Perfil do utilizador autenticado
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "401":
          description: Sem sessão

  /users/create/:
    post:
      tags: [users]
      summary: Cria um utilizador
      description: >
        Client: 403. commercial_grants/commercial_public só podem criar 'client'. Admin escolhe
        qualquer papel. Sem sessão: cria sempre 'client' (role pedido é ignorado) — é a rota
        de registo público.

        PASSWORD: NINGUÉM escolhe a password na criação — nem quem cria a conta de outrem (um
        admin/comercial), nem quem se regista a si próprio (registo público, sem sessão). A
        conta nasce sempre SEM password utilizável e a pessoa recebe logo por email o link
        para a escolher (ver POST /users/password-reset/confirm/). Uma `password` que venha
        no corpo é ignorada em silêncio.

        CAMPOS DE ENTIDADE (role=client, o caso do registo público): `entity_type`,
        `entity_size`, `nif`, `main_cae`, `address` e `postal_code` são obrigatórios.
        - `nif`: tem de ser um NIF de EMPRESA/entidade válido — 9 dígitos, dígito de controlo
          correto (algoritmo oficial), e não pode começar por 1/2/3 (NIF de pessoa singular).
        - `email`: para além do formato, o domínio tem de existir (consulta DNS) e não pode
          ser um webmail genérico/gratuito nem um serviço de email temporário/descartável
          conhecido — mesma regra do gate de contacto do match (ver `common/email_validation.py`).
        - `postal_code`: SUBSTITUI `region` como campo pedido ao utilizador — a `region`
          (e `city`/`county`) é derivada automaticamente a partir dele (CTT + NUTS) e devolvida
          já preenchida na resposta. `nuts_ii`/`nuts_iii` deixaram de ser obrigatórios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Sem permissão para o papel pedido

  /users/{id}/:
    get:
      tags: [users]
      summary: Detalhes de um utilizador
      security: [{ sessionAuth: [] }]
      description: "Admin: qualquer um (só ele vê superusers). Comercial: viewer/client (nunca superuser), mais o próprio. Client: só a si próprio."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "403":
          description: Sem permissão
        "404":
          description: Utilizador não encontrado
    delete:
      tags: [users]
      summary: Desativar Utilizador
      security: [{ sessionAuth: [] }]
      description: "Papel exigido: admin."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Apagado (sem corpo)
        "403":
          description: Sem permissão
        "404":
          description: Utilizador não encontrado

  /users/{id}/update/:
    put:
      tags: [users]
      summary: Edita um utilizador
      security: [{ sessionAuth: [] }]
      description: >
        O próprio, admin (qualquer um), ou commercial_grants/commercial_public (só alvo
        viewer/client, nunca superuser). Só admin pode alterar o papel.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "400":
          description: Dados inválidos
        "403":
          description: Sem permissão
        "404":
          description: Utilizador não encontrado

  /users/{id}/password/:
    post:
      tags: [users]
      summary: Envia o email para definir a password
      security: [{ sessionAuth: [] }]
      description: >
        NÃO define uma password: dispara o link de redefinição para o email JÁ REGISTADO na
        conta. Ninguém — nem o próprio, nem o admin — escolhe aqui uma password, pelo que ela
        nunca passa no corpo do pedido nem pelas mãos de quem gere a conta. O link é o mesmo do
        /users/password-reset/ (assinado, expira em 3 dias) e depois confirma-se em
        /users/password-reset/confirm/. Alcance: o próprio; admin sobre qualquer conta;
        commercial_grants/commercial_public sobre um viewer/client. O corpo do pedido é ignorado.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Email enviado
        "400":
          description: A conta não tem email registado, ou está inativa
        "403":
          description: Sem permissão
        "404":
          description: Utilizador não encontrado

  /users/{id}/activate/:
    post:
      tags: [users]
      summary: Reativar um utilizador
      security: [{ sessionAuth: [] }]
      description: >
        Admin: qualquer um. commercial_grants/commercial_public: só um alvo viewer/client
        (nunca admin/comercial/superuser).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "403":
          description: Sem permissão
        "404":
          description: Utilizador não encontrado

  # ============================= PLANNED GRANTS =============================
  /planned-grants/:
    get:
      tags: [planned-grants]
      summary: Avisos previstos com abertura a partir do dia atual
      security: [{ sessionAuth: [] }]
      description: "Papel exigido: admin, commercial_grants ou commercial_public."
      parameters:
        - name: order_by
          in: query
          schema:
            type: string
            enum: [start_earliest, start_latest, end_earliest, end_latest,
                   allocation_highest, allocation_lowest]
            default: start_earliest
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedGrantListEnvelope" }

  /planned-grants/sync/:
    get:
      tags: [planned-grants]
      summary: Sincroniza o Plano Anual a partir do Excel oficial através de Scrape
      description: >
        Aberto (sem sessão) — pensado para automação diária. Encontra automaticamente o .xlsx
        na página do plano anual, descarrega e faz upsert por plan_id (só grava o que mudou).
        Convites são excluídos.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        "502":
          description: Falha ao aceder à página ou não encontrar o Excel
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  error: { type: string }

  # ============================= NEWSLETTER =============================
  /news/weekly/:
    get:
      tags: [newsletter]
      summary: Novidades da última semana + próximos avisos previstos
      security: [{ sessionAuth: [] }]
      description: >
        Papel exigido: admin, commercial_grants ou commercial_public. Listas completas (sem
        paginação) — a ordenação/pesquisa/filtros dos novos avisos e anúncios ficam a cargo do
        front-end sobre este conjunto pequeno e limitado.
      responses:
        "200":
          description: OK
